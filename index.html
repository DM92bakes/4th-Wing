<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="index, follow">

  <meta name="description" content="Eight approved character portraits for the Fourth Wing first-year RPG campaign.">

  <title>Fourth Wing RPG | Character Portraits</title>

  <style>

    body {

      background: #17141b;

      color: #f5eee5;

      font-family: Georgia, serif;

      margin: 0;

      padding: 24px;

      text-align: center;

    }

    h1 { color: #e6c58c; }

    .gallery {

      display: grid;

      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

      gap: 24px;

      max-width: 1100px;

      margin: 30px auto;

    }

    figure { margin: 0; }

    img {

      width: 100%;

      height: auto;

      border-radius: 12px;

    }

    figcaption {

      padding: 12px;

      font-size: 20px;

    }

  </style>

</head>

<body>

  <h1>Fourth Wing RPG Character Portraits</h1>

  <p>Approved portraits for the Fourth Wing first-year campaign.</p>

  <main class="gallery" id="gallery"></main>

  <script>

    const characters = [

      "Cate Riorson",

      "Xaden Riorson",

      "Garrick Tavis",

      "Imogen Cardulo",

      "Liam Mairi",

      "Bodhi Durran",

      "Sloane Mairi",

      "Rhys Mercer"

    ];

    const gallery = document.getElementById("gallery");

    characters.forEach(name => {

      const figure = document.createElement("figure");

      const img = document.createElement("img");

      const caption = document.createElement("figcaption");

      img.src = encodeURIComponent(name) + ".PNG";

      img.alt = name + " - Fourth Wing RPG approved character portrait";

      img.loading = "lazy";

      caption.textContent = name;

      figure.append(img, caption);

      gallery.appendChild(figure);

    });

  </script>

</body>

</html>
